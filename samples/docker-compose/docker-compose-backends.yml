services:
  haribon:
    image: ghcr.io/marcuwynu23/haribon:latest
    container_name: haribon
    ports:
      - "4444:4444"
    volumes:
      # Config file. Copy the example and edit it, or point this at your own:
      #   cp examples/haribon-config.yml.example examples/haribon-config.yml
      # and change this line to ./examples/haribon-config.yml:Z
      - ./examples/haribon-config.yml.example:/etc/haribon/haribon-config.yml:Z
      # Logs. The config sets log_path: /var/log/haribon.log, so mounting the
      # host directory here leaves that file at ./data/logs/haribon.log.
      - ./data/logs:/var/log:Z

    restart: unless-stopped

  # Example backend services (for testing round-robin).
  # http-echo answers 200 to every path with its -text value, so health probes
  # pass and you can tell which backend served a request.
  backend1:
    image: hashicorp/http-echo
    command: ["-text=backend-1"]
    ports:
      - "4441:5678"

  backend2:
    image: hashicorp/http-echo
    command: ["-text=backend-2"]
    ports:
      - "4442:5678"

  backend3:
    image: hashicorp/http-echo
    command: ["-text=backend-3"]
    ports:
      - "4443:5678"