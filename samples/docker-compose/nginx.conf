events {
    worker_connections 1024;
}

http {
    upstream haribon_backend {
        least_conn;
        server haribon-0:4444 max_fails=3 fail_timeout=5s;
        server haribon-1:4444 max_fails=3 fail_timeout=5s;
        server haribon-2:4444 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://haribon_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_503;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        location /metrics {
            proxy_pass http://haribon_backend;
        }
    }
}
