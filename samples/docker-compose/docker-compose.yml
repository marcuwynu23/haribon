# Local cluster setup with docker-compose
# Run 3 Haribon replicas behind a load balancer for HA testing
#
# Usage:
#   cd samples/docker-compose && docker-compose -f docker-compose.yml up -d
#   docker-compose -f docker-compose.yml ps
#   docker-compose -f docker-compose.yml down
#
# Topology:
#   client → haribon-lb:4444 → [haribon-0, haribon-1, haribon-2] → backends
#                    ↕ gossip :7946
#
# Only the load balancer is published on 4444. Each replica is reachable on
# 4445/4446/4447 for debugging, and publishes its gossip port so you can watch
# the UDP traffic from the host.
#
# The backends are hashicorp/http-echo: each answers 200 to every path and
# prints its own name, so health probes pass and you can see which backend
# served a request.

version: "3.8"

services:
  backend1:
    image: hashicorp/http-echo
    command: ["-text=backend-1", "-listen=:5678"]
    ports:
      - "8081:5678"
    networks:
      - haribon-net

  backend2:
    image: hashicorp/http-echo
    command: ["-text=backend-2", "-listen=:5678"]
    ports:
      - "8082:5678"
    networks:
      - haribon-net

  backend3:
    image: hashicorp/http-echo
    command: ["-text=backend-3", "-listen=:5678"]
    ports:
      - "8083:5678"
    networks:
      - haribon-net

  haribon-0:
    image: ghcr.io/marcuwynu23/haribon:latest
    command: start --config /etc/haribon/haribon-cluster.yml
    ports:
      - "4445:4444"
      - "7946:7946/udp"
    environment:
      - NODE_ID=haribon-0
      - HARIBON_PORT=4444
    volumes:
      - ./haribon-cluster.yml:/etc/haribon/haribon-cluster.yml
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - haribon-net
    deploy:
      replicas: 1

  haribon-1:
    image: ghcr.io/marcuwynu23/haribon:latest
    command: start --config /etc/haribon/haribon-cluster.yml
    ports:
      - "4446:4444"
      - "7947:7946/udp"
    environment:
      - NODE_ID=haribon-1
      - HARIBON_PORT=4444
    volumes:
      - ./haribon-cluster.yml:/etc/haribon/haribon-cluster.yml
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - haribon-net
    deploy:
      replicas: 1

  haribon-2:
    image: ghcr.io/marcuwynu23/haribon:latest
    command: start --config /etc/haribon/haribon-cluster.yml
    ports:
      - "4447:4444"
      - "7948:7946/udp"
    environment:
      - NODE_ID=haribon-2
      - HARIBON_PORT=4444
    volumes:
      - ./haribon-cluster.yml:/etc/haribon/haribon-cluster.yml
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - haribon-net
    deploy:
      replicas: 1

  haribon-lb:
    image: nginx:alpine
    ports:
      - "4444:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - haribon-0
      - haribon-1
      - haribon-2
    networks:
      - haribon-net

networks:
  haribon-net:
    driver: bridge

# Health check (replicas are published on 4445-4447 from the host):
#   curl -s http://localhost:4445/readyz
#   curl -s http://localhost:4445/metrics | grep cluster
#   docker-compose -f docker-compose.yml exec haribon-0 curl -s http://localhost:4444/readyz
#
# Chaos test:
#   docker-compose -f docker-compose.yml stop haribon-0
#   Verify traffic still flows through remaining replicas, and that
#   haribon_cluster_peers drops on the survivors.
