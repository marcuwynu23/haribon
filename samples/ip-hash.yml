# Send the same visitor to the same backend.
#
# Haribon hashes the visitor's address to pick a backend, so a visitor keeps
# landing on the one that already has their session or their cache entry.
host: "0.0.0.0"
port: 4444

balancer:
  strategy: ip_hash

backends:
  - url: "http://backend1:8080"
  - url: "http://backend2:8080"
  - url: "http://backend3:8080"

# Two things to know before relying on this:
#
# 1. Haribon uses the address the request arrives from. If a proxy, a cloud
#    load balancer, or an ingress is in front of it, every request may arrive
#    from that one address and every visitor hashes to the same backend. Check
#    what Haribon sees before trusting the pinning.
#
# 2. The mapping is stable only while the backend list is unchanged. Adding or
#    removing a backend remaps some visitors, so plan for a cache warm-up after
#    a scale event. A visitor whose backend goes down falls through to the next
#    available one rather than getting an error.
