# Haribon on Kubernetes — a working three-replica cluster.
#
#   kubectl apply -f samples/k8s/manifests.yml
#   kubectl rollout status statefulset/haribon
#   kubectl port-forward svc/haribon 4444:4444
#   curl http://localhost:4444/          # served by one of the echo backends
#   curl http://localhost:4444/metrics | grep cluster
#
# A StatefulSet, not a Deployment, and that is deliberate. Haribon's peers are
# listed by name in the config file, so each replica needs a name that does not
# change when it restarts. A Deployment's pods are named
# haribon-<replicaset-hash>-<random>, which cannot be written into a ConfigMap.
# A StatefulSet with serviceName: haribon-headless gives haribon-0, haribon-1,
# haribon-2, and those names resolve through the headless Service.
#
# List all three replicas. Pointing `peers` at the headless Service name instead
# does not work: it resolves to every pod, and only one of those addresses is
# used per message, so results would be unpredictable.

# ── Backends (stand-ins so the sample works end to end) ──────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo
          args: ["-text=hello from a backend", "-listen=:8080"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

# ── Haribon ──────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: haribon
  labels:
    app: haribon
spec:
  serviceName: haribon-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: haribon
  template:
    metadata:
      labels:
        app: haribon
    spec:
      # Must be longer than shutdown_timeout_sec in the config, so the drain
      # has time to finish before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: haribon
          image: ghcr.io/marcuwynu23/haribon:latest
          ports:
            - containerPort: 4444
              name: lb
              protocol: TCP
            - containerPort: 7946
              name: gossip
              protocol: UDP
          env:
            # The pod name, which for a StatefulSet is stable: haribon-0,
            # haribon-1, haribon-2. This is what makes node_id unique per
            # replica without a per-replica config file.
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: HARIBON_PORT
              value: "4444"
            - name: HARIBON_CONFIG
              value: /etc/haribon/config.yml
          volumeMounts:
            - name: config
              mountPath: /etc/haribon
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4444
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4444
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                # Kubernetes removes a pod from Service endpoints at the same
                # time as it sends SIGTERM, not before it, so a request can
                # still arrive in the moment between. Pausing here lets the
                # endpoint removal finish first. The sleep is short enough that
                # terminationGracePeriodSeconds still covers the drain.
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: config
          configMap:
            name: haribon-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - haribon
                topologyKey: kubernetes.io/hostname
---
# Client traffic. The load balancer, a cloud LB, or DNS points here.
apiVersion: v1
kind: Service
metadata:
  name: haribon
  labels:
    app: haribon
spec:
  type: ClusterIP
  selector:
    app: haribon
  ports:
    - port: 4444
      targetPort: 4444
      protocol: TCP
      name: lb
---
# Headless Service. Its job is to give each replica a DNS name
# (haribon-0.haribon-headless, and so on) so the peers list can address them.
apiVersion: v1
kind: Service
metadata:
  name: haribon-headless
  labels:
    app: haribon
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: haribon
  ports:
    - port: 7946
      targetPort: 7946
      protocol: UDP
      name: gossip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: haribon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: haribon
  # minReplicas is 3 because the peers list names exactly three replicas:
  # scaling below that leaves replicas talking to names that are not running.
  # Scaling ABOVE 3 also needs care — a new pod named haribon-3 exchanges no
  # findings with anyone until it is added to the peers list in the ConfigMap.
  # Raise this only together with that list.
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Scaling on haribon_requests_total needs an adapter that can serve custom
  # metrics (prometheus-adapter reading /metrics). Without one the HPA stays in
  # a failed state and will not scale at all, which is worse than CPU-only.
  # See docs/clustering.md for the metrics Haribon exposes.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: haribon
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: haribon
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haribon-config
data:
  config.yml: |
    host: "0.0.0.0"
    port: 4444

    balancer:
      strategy: round_robin

    # Replace with your own Service. Without a backend every request is a 503.
    backends:
      - url: "http://backend:8080"
        weight: 1

    cluster:
      enabled: true
      # Expanded from the environment. The fieldRef above sets NODE_ID to the
      # pod name, so every replica gets its own. If it cannot be resolved,
      # start refuses to run rather than letting two replicas share a node name
      # and silently ignore each other.
      node_id: "${NODE_ID}"
      peers:
        - "haribon-0.haribon-headless:7946"
        - "haribon-1.haribon-headless:7946"
        - "haribon-2.haribon-headless:7946"
      gossip_interval_sec: 5
      gossip_addr: "0.0.0.0:7946"

    health:
      enabled: true
      interval_sec: 5
      timeout_sec: 2
      path: /

    shutdown_timeout_sec: 15
    logging: true
    log_format: json
