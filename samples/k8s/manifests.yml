apiVersion: apps/v1
kind: Deployment
metadata:
  name: haribon
  labels:
    app: haribon
spec:
  replicas: 3
  selector:
    matchLabels:
      app: haribon
  template:
    metadata:
      labels:
        app: haribon
    spec:
      containers:
        - name: haribon
          image: ghcr.io/marcuwynu23/haribon:latest
          ports:
            - containerPort: 4444
              name: lb
              protocol: TCP
            - containerPort: 7946
              name: gossip
              protocol: UDP
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: HARIBON_PORT
              value: "4444"
            - name: HARIBON_CONFIG
              value: /etc/haribon/config.yml
          volumeMounts:
            - name: config
              mountPath: /etc/haribon
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4444
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4444
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: haribon-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - haribon
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: haribon
  labels:
    app: haribon
spec:
  type: ClusterIP
  selector:
    app: haribon
  ports:
    - port: 4444
      targetPort: 4444
      protocol: TCP
      name: lb
---
apiVersion: v1
kind: Service
metadata:
  name: haribon-headless
  labels:
    app: haribon
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: haribon
  ports:
    - port: 7946
      targetPort: 7946
      protocol: UDP
      name: gossip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: haribon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: haribon
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        type: CPU
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: haribon_requests_total
        target:
          type: AverageValue
          averageValue: "1000"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: haribon
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: haribon
---
# ConfigMap for cluster configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: haribon-config
data:
  config.yml: |
    host: "0.0.0.0"
    port: 4444
    balancer:
      strategy: round_robin
    cluster:
      enabled: true
      node_id: "${NODE_ID}"
      peers:
        - "haribon-0:7946"
        - "haribon-1:7946"
        - "haribon-2:7946"
      gossip_interval_sec: 5
      gossip_addr: "0.0.0.0:7946"
    health:
      enabled: true
      interval_sec: 5
      timeout_sec: 2
---
# ConfigMap for cluster gossip config
apiVersion: v1
kind: ConfigMap
metadata:
  name: haribon-cluster
data:
  cluster.yml: |
    cluster:
      enabled: true
      gossip_interval_sec: 5
      gossip_addr: "0.0.0.0:7946"
