# Weighted round-robin load balancer
# Higher weight = more traffic proportionally
host: "0.0.0.0"
port: 4444

balancer:
  strategy: weighted_round_robin

backends:
  # 3x more traffic to backend-a
  - url: "http://backend-a:8080"
    weight: 3
  # Normal traffic to backend-b
  - url: "http://backend-b:8080"
    weight: 1
  # Another normal-weight backend
  - url: "http://backend-c:8080"
    weight: 1
